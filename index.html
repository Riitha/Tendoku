<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendoku</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/90c7dfe809.js" crossorigin="anonymous"></script>

</head>
<body class="w-full h-screen bg-linear-to-b from-indigo-900 to-sky-500">
    <!-- top navigator-->
     <div class="flex flex-row h-20 items-center bg-indigo-950">
        <div class="w-25 h-auto px-4 py-4">
            <img src="icon/logov1.png" alt="tendoku.png">
        </div>
            <div class="text-fuchsia-50 flex flex-row cursor-default">
                <button onclick="resetUser()" class="bg-white text-fuchsia-800 border rounded-xl text-sm p-1 hover:bg-violet-100" >ユーザー変更</button>
        </div>
     </div>
     <!-- end top -->
    <main>
        <!-- search bar-->
        <div class="location-now mt-35 my-8 text-center space-y-4 w-full h-30%">
            <h1 class="text-6xl text-shadow-lg text-shadow-indigo-900 text-fuchsia-100 cursor-default">ようこそ <span id="userName" class="hover:text-violet-300"></span></h1>
            <h1 class="text-2xl text-fuchsia-100 cursor-default" >気になる所を調べてみよう！</h1>
        </div>
        <div class="kensaku flex justify-center items-center w-100% my-8  space-y-4">
            <div class="flex items-center border border-black rounded-xl px-4 py-2 w-[400px] h-15 bg-white">
            <input type="text" id="search-input" placeholder="地域を検索" class="flex-1 text-xl">
            <button onclick="getWeather()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>    
        </div>
        <!-- end search bar -->
            <div class="container-days w-full h-48 flex flex-row justify-center mt-6 mb-6">
                <ul id="container-week" class="flex gap-2"></ul>
            </div>
            <!-- tips -->
             <div class="container-tips w-full h-48 flex flex-row justify-center mt-10 mb-6">
                <ul id="card-tips" class="flex gap-2"></ul>
             </div>
             <!-- end tips -->
    </main>
    <script src="main.js"></script>
</body>
</html>
