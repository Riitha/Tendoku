<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendoku</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/90c7dfe809.js" crossorigin="anonymous"></script>

</head>
<body class="bg-[url(/icon/hiru.png)]">
    <!-- top navigator-->
     <div class="flex flex-row h-20 items-center bg-indigo-950">
        <div class="w-25 h-auto px-4 py-4">
            <img src="icon/logov1.png" alt="tendoku.png">
                </div>
            <div class="text-fuchsia-50 flex flex-row cursor-default">
            <p >ごきげんよう</p><span id="userName" class="hover:text-violet-300">aa</span>
        </div>
     </div>
     <!-- end top -->
    <main>
        <!-- genzai -->
        <div class="location-now my-8 text-center space-y-4">
            <h1 class="text-4xl text-fuchsia-100 cursor-default">現在地</h1>
        </div>
        <div class="kensaku flex justify-center items-center w-auto my-8  space-y-4">
            <div class="flex items-center border border-black rounded-xl px-4 py-2 w-[250px] bg-white">
            <i class="fa-solid fa-location-dot text-[16px] mr-3"></i>
            <input type="text" placeholder="地域を検索">
            </div>    
        </div>
        <!-- tenki card -->
         <div class="tenki-countainer w-full flex justify-center gap-2">
            <!-- 今日 -->
            <div class="kyou-card bg-sky-300 w-[250px] border border-none rounded-xl pt-2 pb-4">
                <div class="kyou-taitoru ">
                <p class="text-xl mb-4 flex justify-center text-fuchsia-50">本日</p>
                </div>

                <div class="kyou-logo flex items-center justify-center items-center">
                    <img src="icon/晴れ light.png" alt="tenki.jpg" class="w-20 m-2">
                        <div class="kio-text w-[50%] flex flex-col items-end">
                            <p class="text-[40px] text-fuchsia-50">24°</p>
                            <p class="text-xl mr-3 text-fuchsia-50">晴れ</p>
                        </div>
                    </div>
                </div>
                <!-- 明日 start -->
                <div class="kyou-card bg-rose-400 w-[250px] border border-none rounded-xl pt-2 pb-4">
                <div class="kyou-taitoru ">
                <p class="text-xl mb-4 flex justify-center text-fuchsia-50">明日</p>
                </div>

                <div class="kyou-logo flex items-center justify-center items-center">
                    <img src="icon/晴れ light.png" alt="tenki.jpg" class="w-20 m-2">
                        <div class="kio-text w-[50%] flex flex-col items-end">
                            <p class="text-[40px] text-fuchsia-50">24°</p>
                            <p class="text-xl mr-3 text-fuchsia-50">晴れ</p>
                        </div>
                    </div>
                </div>
            </div>    
            </div>
            <!-- 明日 end-->
             
         <!-- end genzai -->
    </main>
</body>
</html>
